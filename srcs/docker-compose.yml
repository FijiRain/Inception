secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

volumes:
  db_data:
    driver_opts:
      type: none
      o: bind
      device: /home/tmoga/data/db_data
  wp_data:
    driver_opts:
      type: none
      o: bind
      device: /home/tmoga/data/wp_data

networks:
  inception:
    driver: bridge

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
      - credentials
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception
    restart: always

  nginx:
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx:inception
    container_name: nginx
    depends_on:
      - wordpress
    ports:
    # changer port ici et nginx.conf
      - "443:443"
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception
    restart: always
